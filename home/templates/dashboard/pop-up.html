{% extends 'master.html' %}
{% block content %}
<dialog id="deleteModal" class="delete-dialog">
  <h3>Confirm Deletion</h3>
  <p id="deleteMessage">Are you sure you want to delete this task?</p>
  
  <form id="deleteForm" method="POST" action="">
    {% csrf_token %}
    <div class="actions">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="danger-btn">Yes, Delete</button>
    </div>
  </form>
</dialog>
{% endblock %}
