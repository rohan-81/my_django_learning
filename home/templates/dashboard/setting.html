{% extends 'master.html' %}

{% block title %}Update password| TaskFlow{% endblock %}

{% block content %}

<div class="update-container">
    <div class="update-card">
        <div class="card-header">
            <h2>Setting </h2>
            <p>Change your Password</p>
        </div>

        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="pass">Enter your old Password</label>
                <input type="password" id="pass" name="pass" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="pass1">Enter New Password</label>
                <input type="password" id="pass1" name="pass1" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="pass2">Confirm New Password</label>
                <input type="password" id="pass2" name="pass2" placeholder="••••••••" required>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{% url 'home' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
