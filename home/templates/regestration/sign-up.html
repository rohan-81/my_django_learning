<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account | TaskFlow</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --bg-page: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-focus: #818cf8;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .signup-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            padding: 36px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.86rem;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            background-color: #ffffff;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .error-alert {
            background-color: var(--danger-light);
            border: 1px solid #fecaca;
            color: var(--danger);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .footer-note a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="signup-card">
        <div class="brand-header">
            <h2>Create Account</h2>
            <p>Get started with your free task manager</p>
        </div>

        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="uname">Username</label>
                <input type="text" id="uname" name="uname" placeholder="e.g. rohan_pedhadiya" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="enter your mail" required>
            </div>

            <div class="form-group">
                <label for="number">Phone Number</label>
                <input type="tel" maxlength="10" id="number" name="number" placeholder="enter your phone number"
                    required inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" placeholder="enter your date of birth " required>
            </div>

            
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="enter your address" required>
            </div>

            <div class="form-group  style=" display: flex; align-items: center; gap: 1px;">
                <label for="gen">Gender</label>
                <input type="radio" value="Male" name="gen" style="width: 10%;">Male
                <input type="radio" value="Female" name="gen" style="width: 10%;">Female
                <input type="radio" value="Other" name="gen" style="width: 10%;">Other
            </div>


            <div class="form-group">
                <label for="pass1">Password</label>
                <input type="password" id="pass1" name="pass1" placeholder="••••••••" required
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="pass2">Confirm Password</label>
                <input type="password" id="pass2" name="pass2" placeholder="••••••••" required
                    autocomplete="new-password">
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 1px;">
                <input type="checkbox" id="tc" name="tc" required style="width: 10%;">Read Terms & Conditions
            </div>

            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="footer-note">
            Already have an account? <a href="{% url 'login' %}">Log In</a>
        </div>
    </div>

</body>

</html>
