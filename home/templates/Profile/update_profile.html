{% extends 'master.html' %}

{% block title %}Update Profile | TaskFlow{% endblock %}

{% block content %}

<div class="update-container">
    <div class="update-card">
        <div class="card-header">
            <h2>Edit Profile</h2>
            <p>Update your personal information</p>
        </div>

        {% if error %}
        <div class="error-alert">
            {{ error }}
        </div>
        {% endif %}



        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ request.user.username }}" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ request.user.email }}"
                    placeholder="name@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="number"></label>Address</label>
                <input type="text" id="address" name="address" value="{{ request.user.profile.address }}"
                    placeholder="enter your new address" required>
            </div>

            <div class="form-group">
                <label for="gen">Gender</label>
                <input type="text" id="gen" name="gen" value="{{ request.user.profile.gender }}" disabled>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <!-- HTML5 date pickers require strict YYYY-MM-DD format to show existing value -->
                <input type="text" id="dob" name="dob" value="{{ request.user.profile.dob }}" disabled>
            </div>

            <div class="form-group">
                <label for="number">Phone Number</label>
                <input type="tel" id="number" name="number" value="{{ request.user.profile.number|default:'' }}"
                    placeholder="e.g. 9876543210" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>

            <div class="form-group">
                <label for="number">Age</label>
                <input type="number" id="age" name="age" value="{{ request.user.profile.age|default:'' }}" disabled>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{% url 'profile' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
